      body {

      /* Print Styles - Optimized for Full Page A4 */
      @media print {
        @page {
          size: A4 portrait;
          margin: 3mm 4mm !important;
        }

        html, body {
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          overflow: visible !important;
        }

        /* --- Global Print Hides --- */
        .no-print, 
        .main-navbar,
        .print-hidden,
        .print\:hidden {
          display: none !important;
        }

        /* --- MODAL PRINT MODE --- */
        body.print-mode-modal #root {
          display: none !important;
        }

        body.print-mode-modal #modal-root {
          display: block !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          right: 0 !important;
          width: 100% !important;
          height: auto !important;
          background: white !important;
          z-index: 99999 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        /* Ensure table rows do not break mid-row across pages */
        tr {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }
        
        /* General Table Styles for Print */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
      }
    </style>
